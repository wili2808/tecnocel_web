<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/tecnocel.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TecnoCel — Tienda de productos tecnológicos en Argentina. Celulares, accesorios y más al mejor precio." />
    <meta name="theme-color" content="#0EA5E9" />
    <meta property="og:title" content="TecnoCel" />
    <meta property="og:description" content="Tienda de productos tecnológicos en Argentina. Celulares, accesorios y más al mejor precio." />
    <meta property="og:type" content="website" />
    <title>TecnoCel — Tecnología al mejor precio</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* ── Splash de carga inicial ── */
      #splash-root {
        position: fixed; inset: 0; z-index: 999999;
        display: flex; align-items: center; justify-content: center;
        background: #ffffff;
        font-family: 'Poppins', system-ui, -apple-system, sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      @media (prefers-color-scheme: dark) {
        #splash-root { background: #18181B; }
      }
      #splash-root.splash-hidden {
        opacity: 0; visibility: hidden;
      }
      .splash-inner {
        display: flex; flex-direction: column; align-items: center; gap: 24px;
      }
      .splash-ring {
        width: 48px; height: 48px;
        border: 3px solid #E2E8F0;
        border-top-color: #0EA5E9;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        .splash-ring { border-color: #3F3F46; border-top-color: #0EA5E9; }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      .splash-brand {
        display: flex; flex-direction: column; align-items: center; gap: 4px;
      }
      .splash-brand-name {
        font-size: 28px; font-weight: 800; letter-spacing: 3px;
        background: linear-gradient(135deg, #0EA5E9, #0284C7);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .splash-brand-tagline {
        font-size: 13px; color: #64748B; font-weight: 400; letter-spacing: 0.3px;
      }
      @media (prefers-color-scheme: dark) {
        .splash-brand-tagline { color: #94A3B8; }
      }
      .splash-loader {
        display: flex; flex-direction: column; align-items: center; gap: 12px;
      }
      .splash-loader-text {
        font-size: 13px; color: #94A3B8; font-weight: 400;
      }
      @media (prefers-color-scheme: dark) {
        .splash-loader-text { color: #64748B; }
      }
      .splash-loader-bar {
        width: 160px; height: 3px; border-radius: 2px;
        background: #E2E8F0; overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        .splash-loader-bar { background: #3F3F46; }
      }
      .splash-loader-bar-fill {
        width: 0; height: 100%; border-radius: 2px;
        background: linear-gradient(90deg, #0EA5E9, #06B6D4);
        animation: splash-progress 1.8s ease-in-out infinite;
      }
      @keyframes splash-progress {
        0% { width: 0; margin-left: 0; }
        50% { width: 70%; margin-left: 0; }
        100% { width: 0; margin-left: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-ring { animation: none; border-top-color: #0EA5E9; }
        .splash-loader-bar-fill { animation: none; width: 60%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash-root">
        <div class="splash-inner">
          <div class="splash-ring"></div>
          <div class="splash-brand">
            <span class="splash-brand-name">TECNOCEL</span>
            <span class="splash-brand-tagline">Tecnología al mejor precio</span>
          </div>
          <div class="splash-loader">
            <span class="splash-loader-text">Cargando...</span>
            <div class="splash-loader-bar">
              <div class="splash-loader-bar-fill"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
